[project]
name = "umd-schedule-optimizer"
version = "0.1.0"
description = "UMD Schedule Optimizer - A 4-year college schedule optimizer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12",
    "networkx>=3.5",
    "pytest>=8.4.2",
    "requests>=2.31",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["optimizer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
